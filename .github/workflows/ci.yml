name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan git history with TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ""
          head: HEAD
          version: 3.95.5
          extra_args: --results=verified,unknown

  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm --silent run typecheck

      - name: Lint
        run: npm --silent run lint

      - name: Check formatting
        run: npm --silent run format:check

      - name: Test
        run: npm --silent run test --if-present

      - name: Build
        run: npm --silent run build
