name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history with Gitleaks
        run: >
          docker run --rm
          --user "$(id -u):$(id -g)"
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --no-banner --redact --verbose /repo

      - name: Scan git history with TruffleHog
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown --fail

  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm --silent run typecheck

      - name: Lint
        run: npm --silent run lint

      - name: Check formatting
        run: npm --silent run format:check

      - name: Test
        run: npm --silent run test --if-present

      - name: Build
        run: npm --silent run build
