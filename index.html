<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9f9f5" />
    <meta
      name="description"
      content="Local Media Converter converts audio, video, and images in your browser with FFmpeg. Your files aren't uploaded anywhere."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />

    <title>Local Media Converter</title>
    <script>
      if (
        window.location.protocol !== "file:" &&
        "serviceWorker" in navigator
      ) {
        navigator.serviceWorker.register("%BASE_URL%coi-serviceworker.js");
      }
    </script>
  </head>
