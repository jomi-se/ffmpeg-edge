<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f3" />
    <meta
      name="description"
      content="Local Media Converter converts audio, video, and images in your browser with FFmpeg. Your files stay on your device."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <title>Local Media Converter</title>
    <script>
      if (
        window.location.protocol !== "file:" &&
        "serviceWorker" in navigator
      ) {
        navigator.serviceWorker.register("%BASE_URL%coi-serviceworker.js");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
